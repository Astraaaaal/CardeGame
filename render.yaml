# ── Render Blueprint ──
# Déploie l'ensemble de l'application CardeGame sur Render.
# NB: en dev, la BDD est un Postgres Neon distant (voir backend/.env),
#     pas la base définie ici. Ce bloc `databases` ne sert qu'au déploiement Render.

databases:
  - name: cardegame-db
    plan: free
    databaseName: cardegame
    user: cardegame

services:
  # ── Backend API (FastAPI) ──
  - type: web
    name: cardegame-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardegame-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://cardegame.onrender.com"]'
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/health

  # ── Frontend (Static Site — React PWA) ──
  - type: web
    name: cardegame
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://cardegame-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
