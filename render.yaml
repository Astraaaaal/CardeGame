# ── Render Blueprint ──
# Déploie CardeGame sur Render : API (Docker) + site statique (React PWA).
# La base de données est un Postgres Neon EXTERNE (pas de bloc `databases:` ici) :
#   - Neon free ne s'auto-supprime pas (contrairement au Postgres Render free).
#   - DATABASE_URL est à renseigner à la main dans le dashboard Render (secret).

services:
  # ── Backend API (FastAPI) ──
  - type: web
    name: cardegame-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false            # ← coller l'URL Neon dans le dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true    # protège /api/admin/* (en-tête X-Admin-Key)
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://cardegame.onrender.com"]'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Frontend (site statique — React PWA) ──
  - type: web
    name: cardegame
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://cardegame-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
